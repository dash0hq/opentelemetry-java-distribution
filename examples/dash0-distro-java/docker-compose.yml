services:

  # Receives OTLP/HTTP from both applications and writes each signal to a JSONL
  # file under ./output. It runs as the host user so the files it creates in
  # that bind mount are owned by whoever ran docker compose, not by root.
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    user: "${SCRIPT_UID:-1000}:${SCRIPT_GID:-1000}"
    command: ["--config=/etc/otelcol/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otelcol/collector-config.yaml:ro
      - ./output:/output

  # The ordinary way to use the distribution: the agent jar straight from the
  # Gradle build, attached with -javaagent:, pointed at a collector with
  # DASH0_OTEL_COLLECTOR_BASE_URL. The application never names an OTLP endpoint
  # and contains no OpenTelemetry code; telemetry arriving at all is what proves
  # that variable is honoured.
  app:
    image: eclipse-temurin:21-jdk
    working_dir: /app
    volumes:
      - ./app:/app:ro
      - ../../agent/build/libs:/agent:ro
    environment:
      DASH0_OTEL_COLLECTOR_BASE_URL: http://collector:4318
      OTEL_SERVICE_NAME: dash0-distro-java-demo
      OTEL_METRIC_EXPORT_INTERVAL: "1000"
      OTEL_BSP_SCHEDULE_DELAY: "500"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        until (echo > /dev/tcp/collector/4318) 2>/dev/null; do sleep 0.5; done
        javac -d /tmp/classes /app/DemoApplication.java
        exec java -javaagent:"$$(ls /agent/dash0-opentelemetry-javaagent-*.jar)" \
          -cp /tmp/classes DemoApplication
    depends_on:
      collector:
        condition: service_started

  # The same application in the layout a Dash0 Linux package installs: the agent
  # jar under a fixed directory with dash0-resource-attributes.properties beside
  # it. Dash0PackageResourceProvider reads that file and turns each key into a
  # resource attribute, which is how dash0.package.name and dash0.package.version
  # reach telemetry for a package-installed agent. The jar is copied out of the
  # read-only mount because the properties file has to sit next to it.
  app-packaged:
    image: eclipse-temurin:21-jdk
    working_dir: /app
    volumes:
      - ./app:/app:ro
      - ../../agent/build/libs:/agent:ro
    environment:
      DASH0_OTEL_COLLECTOR_BASE_URL: http://collector:4318
      OTEL_SERVICE_NAME: dash0-distro-java-packaged-demo
      OTEL_METRIC_EXPORT_INTERVAL: "1000"
      OTEL_BSP_SCHEDULE_DELAY: "500"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        until (echo > /dev/tcp/collector/4318) 2>/dev/null; do sleep 0.5; done
        mkdir -p /usr/lib/opentelemetry/java
        cp /agent/dash0-opentelemetry-javaagent-*.jar \
          /usr/lib/opentelemetry/java/opentelemetry-javaagent.jar
        printf 'dash0.package.name=dash0-java-autoinstrumentation\ndash0.package.version=0.0.0-example\n' \
          > /usr/lib/opentelemetry/java/dash0-resource-attributes.properties
        javac -d /tmp/classes /app/DemoApplication.java
        exec java -javaagent:/usr/lib/opentelemetry/java/opentelemetry-javaagent.jar \
          -cp /tmp/classes DemoApplication
    depends_on:
      collector:
        condition: service_started
