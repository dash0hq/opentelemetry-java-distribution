[versions]
# The upstream OpenTelemetry Java agent this distribution builds on.
# Renovate keeps this current; see .github/renovate.json5.
#
# The "-alpha" coordinates are not optional. The javaagent extension APIs are
# published only in opentelemetry-instrumentation-bom-alpha, so every vendor
# distribution depends on artifacts upstream marks as unstable. See CLAUDE.md.
opentelemetryJavaagent = "2.33.1"
opentelemetryJavaagentAlpha = "2.33.1-alpha"

autoService = "1.1.1"
slf4j = "2.0.17"
logback = "1.5.18"
log4j = "2.26.1"
jbossLogmanager = "2.1.19.Final"
junit = "5.11.4"
assertj = "3.27.3"
shadow = "8.3.6"
spotless = "6.25.0"

[libraries]
opentelemetryInstrumentationBom = { group = "io.opentelemetry.instrumentation", name = "opentelemetry-instrumentation-bom", version.ref = "opentelemetryJavaagent" }
opentelemetryInstrumentationBomAlpha = { group = "io.opentelemetry.instrumentation", name = "opentelemetry-instrumentation-bom-alpha", version.ref = "opentelemetryJavaagentAlpha" }

opentelemetryJavaagent = { group = "io.opentelemetry.javaagent", name = "opentelemetry-javaagent", version.ref = "opentelemetryJavaagent" }
opentelemetryJavaagentExtensionApi = { group = "io.opentelemetry.javaagent", name = "opentelemetry-javaagent-extension-api" }
opentelemetryJavaagentTooling = { group = "io.opentelemetry.javaagent", name = "opentelemetry-javaagent-tooling" }
opentelemetryInstrumentationApi = { group = "io.opentelemetry.instrumentation", name = "opentelemetry-instrumentation-api" }
opentelemetrySdk = { group = "io.opentelemetry", name = "opentelemetry-sdk" }
opentelemetrySdkAutoconfigureSpi = { group = "io.opentelemetry", name = "opentelemetry-sdk-extension-autoconfigure-spi" }
opentelemetrySdkTesting = { group = "io.opentelemetry", name = "opentelemetry-sdk-testing" }

slf4jApi = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logbackClassic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
log4jApi = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4jCore = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
jbossLogmanager = { group = "org.jboss.logmanager", name = "jboss-logmanager", version.ref = "jbossLogmanager" }

autoServiceAnnotations = { group = "com.google.auto.service", name = "auto-service-annotations", version.ref = "autoService" }
autoServiceProcessor = { group = "com.google.auto.service", name = "auto-service", version.ref = "autoService" }

junitBom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junitJupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junitPlatformLauncher = { group = "org.junit.platform", name = "junit-platform-launcher" }
assertj = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
