name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true

permissions: {}

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require a release tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' does not match vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Refuse a tag that is not reachable from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not reachable from origin/main; refusing to publish."
            exit 1
          fi

      - name: Refuse a tag that disagrees with gradle.properties
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^version *= *//p' gradle.properties)"
          if [ "v$declared" != "$TAG" ]; then
            echo "::error::gradle.properties declares $declared but the tag is $TAG"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Collect the release assets
        run: |
          set -euo pipefail
          mkdir dist
          cp agent/build/libs/dash0-opentelemetry-javaagent-*.jar dist/
          cp agentextension/build/libs/dash0-opentelemetry-agentextension-*.jar dist/
          (cd dist && sha256sum -- *.jar > SHA256SUMS)
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.jar

      - name: Extract the release notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v version="$version" '
            !found && index($0 " ", version " ") == 1 { found = 1; next }
            found == 1 && /^=+$/ { found = 2; next }
            found == 2 && /^=+$/ { hit_next = 1; exit }
            found == 2 { lines[n++] = $0 }
            END {
              stop = hit_next ? n - 1 : n
              for (i = 0; i < stop; i++) print lines[i]
            }
          ' CHANGELOG.rst > notes.rst

          if [ ! -s notes.rst ]; then
            echo "::error::CHANGELOG.rst has no section for $version"
            exit 1
          fi

          sed -e 's/`\([^`<]*\) <\([^>]*\)>`__/\1: \2/g' \
              -e 's/``\([^`]*\)``/`\1`/g' \
              notes.rst > notes.md
          cat notes.md

      - name: Upload the assets to a draft release and publish it
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "$TAG" --notes-file notes.md
          fi

          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::$TAG is already published; re-running would leave its" \
              "asset set in an unknown state. Bump the version and re-tag."
            exit 1
          fi

          for file in dist/*; do
            gh release upload "$TAG" "$file" --clobber
          done

          gh release edit "$TAG" --draft=false --latest

  sync-docs:
    name: Synchronize the docs
    needs: release
    uses: ./.github/workflows/sync-docs.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      dry-run: false
