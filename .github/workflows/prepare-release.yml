name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, with no leading v (e.g. 0.2.0)"
        required: true
      date:
        description: "Date for the CHANGELOG.rst heading (YYYY-MM-DD, defaults to today)"
        required: false
        default: ""
      next-version:
        description: "Version main returns to once the release publishes (e.g. 0.2.1-SNAPSHOT, defaults to the next minor)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Commit the release preparation to main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require the token whose pushes start another workflow
        env:
          FULL_ACCESS_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FULL_ACCESS_TOKEN" ]; then
            echo "::error::REPOSITORY_FULL_ACCESS_GITHUB_TOKEN is not available to" \
              "this repository. A push made with the default GITHUB_TOKEN starts no" \
              "further workflow, so create-tag-for-release.yml would never run and" \
              "nothing would be published. See RELEASING.rst."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}

      - name: Check the inputs
        id: inputs
        env:
          RAW_VERSION: ${{ inputs.version }}
          RAW_DATE: ${{ inputs.date }}
          RAW_NEXT_VERSION: ${{ inputs['next-version'] }}
        run: |
          set -euo pipefail
          version="$(.github/workflows/scripts/check-release-version.sh "$RAW_VERSION")"
          date="$(.github/workflows/scripts/resolve-release-date.sh "$RAW_DATE")"
          if [ -n "$RAW_NEXT_VERSION" ]; then
            printf 'subject\n\nNext-Version: %s\n' "$RAW_NEXT_VERSION" \
              | .github/workflows/scripts/next-snapshot-version.sh "$version" > /dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing $version dated $date."

      - name: Refuse a version that is already tagged
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::$TAG already exists. Pick a higher version; a published" \
              "version is never re-cut."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set the release version in gradle.properties
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: .github/workflows/scripts/set-gradle-version.sh "$VERSION"

      - name: Fold the pending changelog entries into a new section
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          DATE: ${{ steps.inputs.outputs.date }}
        run: make chlog-update VERSION="$VERSION - $DATE"

      - name: Commit and push to main
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          NEXT_VERSION: ${{ inputs['next-version'] }}
        run: |
          set -euo pipefail
          git config user.name d0etu
          git config user.email d0etu@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "::error::nothing changed. gradle.properties may already declare" \
              "$VERSION, and there may be no entries under .chloggen/ to fold."
            exit 1
          fi
          subject="docs: update changelog to prepare release v$VERSION"
          if [ -n "$NEXT_VERSION" ]; then
            git commit -m "$subject" -m "Next-Version: $NEXT_VERSION"
          else
            git commit -m "$subject"
          fi
          git push origin HEAD:main
