name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Runs spotless, the unit tests, both shadow jars, and the smoke tests.
      # The smoke tests launch a real JVM with the built agent attached, so this
      # single command covers packaging and runtime behaviour as well as compilation.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload the built artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            agent/build/libs/*.jar
            agentextension/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  supported-jvms:
    name: Dash0 customisations work on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The upstream agent supports Java 8 and later, so the distribution has
        # to attach cleanly across that range, not just on the build JDK.
        java: [8, 11, 17, 21, 25]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up the build JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble the agent
        run: ./gradlew :agent:shadowJar :smoke-tests:compileJava --stacktrace

      - name: Set up the target JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Exports to the console rather than disabling every exporter, so this
      # asserts that the Dash0 customisations work on each JVM rather than only
      # that the agent attaches without crashing. The smoke tests cover the
      # build JDK; without this, nothing covered the rest of the range.
      - name: Attach the agent and assert the Dash0 attributes
        run: |
          set -euo pipefail
          agent="$(ls agent/build/libs/dash0-opentelemetry-javaagent-*.jar)"
          run_agent() {
            java -javaagent:"$agent" \
              -Dotel.traces.exporter=none \
              -Dotel.logs.exporter=none \
              -Dotel.metrics.exporter=logging \
              -Dotel.metric.export.interval=500 \
              -Dotel.service.name=supported-jvm-check \
              -cp smoke-tests/build/classes/java/main \
              com.dash0.opentelemetry.smoketest.TestApplication 3000 2>&1
          }

          output="$(run_agent)"
          echo "$output"
          if grep -q "OpenTelemetry Javaagent failed to start" <<< "$output"; then
            echo "::error::the agent failed to start on Java ${{ matrix.java }}"
            exit 1
          fi
          grep -q "test-application-completed" <<< "$output"
          grep -q "LoggingMetricExporter" <<< "$output"
          grep -q 'telemetry.distro.name="dash0-java"' <<< "$output"

          # DASH0_DISABLE exercises the configuration customizer, the other half
          # of what this distribution adds. The run above is its control: without
          # it, this check would also pass on a JVM where nothing ran at all.
          disabled="$(DASH0_DISABLE=true run_agent)"
          echo "$disabled"
          grep -q "test-application-completed" <<< "$disabled"
          if grep -q "LoggingMetricExporter" <<< "$disabled"; then
            echo "::error::DASH0_DISABLE did not stop telemetry on Java ${{ matrix.java }}"
            exit 1
          fi

  relocations:
    name: Relocations in sync with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The relocation rules are copied from upstream and decide which packages
      # are rewritten into the agent's shaded namespace. A rule upstream added
      # and we did not copy produces no error, only instrumentation that never
      # runs, so nothing but this comparison would notice.
      - name: Compare against upstream at the pinned agent version
        run: scripts/check-relocations.sh

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Validate pending changelog entries
        run: make chlog-validate

      # Changes that do not affect users are exempt: start the pull request
      # title with "chore" or apply the "Skip Changelog" label.
      - name: Require a changelog entry
        if: >
          !startsWith(github.event.pull_request.title, 'chore')
          && !contains(github.event.pull_request.labels.*.name, 'Skip Changelog')
        run: |
          set -euo pipefail
          if ! git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
              | grep -qE '^\.chloggen/.+\.yaml$'; then
            echo "No .chloggen entry found on this branch."
            echo "Add one with 'make chlog-new', or mark the pull request as chore/Skip Changelog."
            exit 1
          fi
