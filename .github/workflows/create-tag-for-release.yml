name: Create tag for release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  create-tag-for-release:
    name: Tag a prepared release
    if: "startsWith(github.event.head_commit.message, 'docs: update changelog to prepare release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the token whose pushes start another workflow
        env:
          FULL_ACCESS_TOKEN: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FULL_ACCESS_TOKEN" ]; then
            echo "::error::REPOSITORY_FULL_ACCESS_GITHUB_TOKEN is not available to" \
              "this repository. A tag pushed with the default GITHUB_TOKEN starts no" \
              "further workflow, so release.yml would not run and nothing would be" \
              "published. See RELEASING.rst."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}

      - name: Create and push the release tag
        run: .github/workflows/scripts/create-tag-for-release.sh
