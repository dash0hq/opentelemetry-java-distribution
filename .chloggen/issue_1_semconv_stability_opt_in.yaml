change_type: breaking

component: custom

note: Default otel.semconv-stability.opt-in to database,code,rpc,messaging, so spans carry the newer semantic convention attribute names

issues: [12]

subtext: |
  The distribution set nothing and inherited the upstream agent's default, which
  is the superseded convention in every domain. A JDBC span carried
  ``db.statement``, ``db.system``, ``db.name`` and ``db.operation`` rather than
  ``db.query.text``, ``db.system.name``, ``db.namespace`` and
  ``db.operation.name``.
  ``database`` and ``code`` select conventions the semantic conventions working
  group has declared stable. ``rpc`` and ``messaging`` select experimental ones,
  included because the working group considers their current shape close to
  final; a future agent version may still rename those attributes.
  ``service.peer`` is left out, because its attributes are expected to change
  again. ``http`` is not a value at all: HTTP semantic conventions are stable and
  the agent emits them whatever this setting says.
  Attribute names are not the only thing that changes. A JDBC span is named after
  a summary of the query rather than ``<operation> <database>.<table>``. An RPC
  span is named ``<method>`` rather than ``<service>/<method>``, except under
  gRPC, which always uses the full method name. A messaging receive span has kind
  ``CLIENT`` rather than ``CONSUMER``, and a send span whose context is not
  propagated has kind ``CLIENT`` rather than ``PRODUCER``. RabbitMQ starts
  recording a receive span for every ``basicGet``, which it did not record at
  all before.
  The metrics change too. The agent starts recording
  ``db.client.operation.duration``, ``messaging.client.operation.duration``,
  ``messaging.client.sent.messages``, ``messaging.process.duration`` and
  ``messaging.client.consumed.messages``. Pulsar, the one instrumentation still
  emitting the pre-1.43 ``messaging.publish.duration``,
  ``messaging.receive.duration`` and ``messaging.receive.messages``, stops
  emitting all three. Every connection pool instrument is renamed from
  ``db.client.connections.*`` to ``db.client.connection.*``, two of them by more
  than the prefix: ``db.client.connections.usage`` becomes
  ``db.client.connection.count`` and ``db.client.connections.max`` becomes
  ``db.client.connection.limit``. The ``pool.name``
  and ``state`` attributes become ``db.client.connection.pool.name`` and
  ``db.client.connection.state``, and ``create_time``, ``wait_time`` and
  ``use_time`` are recorded in seconds rather than milliseconds. A threshold
  written in milliseconds is then a thousand times too high and the alert stops
  firing rather than failing.
  Existing dashboards, alerting rules and saved queries written against any of
  the old names stop matching, and none of them reports an error. Set
  ``OTEL_SEMCONV_STABILITY_OPT_IN`` or ``-Dotel.semconv-stability.opt-in`` on the
  workload to choose your own domains, or append ``/dup`` to a domain, as in
  ``database/dup,code,rpc,messaging``, to emit both sets while you migrate.
  ``messaging/dup`` covers metrics too and keeps Pulsar's three pre-1.43
  instruments alongside the new ones. The connection pool instruments are the
  exception, because the agent picks one name for each of them rather than
  recording both, so ``database/dup`` still renames them and still moves those
  three histograms to seconds. To keep the old
  names everywhere, set the variable to a value that names no domain, such as
  ``none``. Clearing the variable does not work, because a blank value is
  treated as unset, and neither does writing the setting in the file named by
  ``otel.javaagent.configuration-file``, which reaches ``ConfigProperties``
  rather than the place the agent reads this setting from.
  The value is applied with ``System.setProperty`` during agent startup rather
  than through an autoconfiguration hook. The agent resolves it in
  ``SemconvSelectionResolver`` with ``SystemProperty.getString``, which reads
  only ``System.getProperty`` and ``System.getenv``, so a value returned from
  ``addPropertiesSupplier`` or ``addPropertiesCustomizer`` would reach
  ``ConfigProperties`` and change no attribute. Nothing is set when the system
  property or the environment variable already carries a value.
  Declarative configuration is unaffected and remains unsupported. Under
  ``OTEL_CONFIG_FILE`` the SDK never consults the autoconfigure SPI, so this
  default does not apply there any more than ``DASH0_DISABLE`` and the
  ``always_on`` sampler do; see ``docs/configuration.md``.

