change_type: breaking

component: custom

note: Default otel.propagators to tracecontext,baggage,xray instead of tracecontext,baggage, so a trace survives an AWS load balancer that rewrites X-Amzn-Trace-Id

issues: [16]

subtext: |
  When an incoming request carries both ``traceparent`` and ``X-Amzn-Trace-Id``,
  the X-Ray context now wins. Set ``OTEL_PROPAGATORS=tracecontext,baggage`` to
  restore the previous behavior.

