change_type: breaking
component: custom
note: Let OTEL_EXPORTER_OTLP_ENDPOINT win over DASH0_OTEL_COLLECTOR_BASE_URL
issues: [1]
subtext: |
  DASH0_OTEL_COLLECTOR_BASE_URL used to replace an OTEL_EXPORTER_OTLP_ENDPOINT
  that was already set. It is now a default that the standard name overrides,
  matching the Python and Ruby distributions, which use environ.setdefault and
  Environment.set_default respectively. The Dash0 name is what a single
  /etc/opentelemetry/injector/default_env.conf puts on a whole host, and a
  host-wide default should not silently beat a setting made on one workload.

  DASH0_DISABLE is unchanged and still overrides OTEL_SDK_DISABLED, which is
  also what Python and Ruby do. A kill switch another setting can cancel is
  not one.
