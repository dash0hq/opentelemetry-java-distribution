subtext: |
  Records how upstream prescribes a distribution be built, the techniques the
  seven surveyed vendor distributions use to work around that, what each one
  changes with respect to upstream, and how their builds and upstream tracking
  work. The decision record links to it, so the reasoning behind each decision
  can be checked rather than taken on trust.
