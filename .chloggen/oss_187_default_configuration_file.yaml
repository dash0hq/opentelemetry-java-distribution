change_type: breaking

component: custom

note: Configure the SDK from /etc/opentelemetry/java/otel-config.yaml when OTEL_CONFIG_FILE is unset

issues: [21]

subtext: |
  A Dash0 Linux package installs an OpenTelemetry configuration file at
  ``/etc/opentelemetry/java/otel-config.yaml``, and nothing read it. The file
  stayed inert until a host administrator also set ``OTEL_CONFIG_FILE``, and the
  one place that reaches every process on a host,
  ``/etc/opentelemetry/injector/default_env.conf``, can only name one path for
  every language at once.
  The order is now ``OTEL_CONFIG_FILE`` when it is set to anything that is not
  blank, then ``/etc/opentelemetry/java/otel-config.yaml`` when that file
  exists, then the environment variables, which is what a host without the file
  keeps doing. An ``OTEL_CONFIG_FILE`` that names a file which does not exist
  counts as set, so the SDK reports the error instead of this distribution
  quietly loading a different file.
  ``Dash0DefaultConfigurationFileProvider`` registers under
  ``DeclarativeConfigurationProvider``, which
  ``AutoConfiguredOpenTelemetrySdkBuilder.buildImpl`` reaches through
  ``maybeConfigureFromFile`` before it reads ``otel.config.file`` and before it
  loads a single ``AutoConfigurationCustomizerProvider``. That ordering is also
  why the provider reads ``otel.config.file`` itself, from the system property
  first and the environment variable second: a provider that answered
  unconditionally would override the file an operator named.
  ``Dash0DeclarativeConfigurationCustomizerProvider`` still runs over the
  resulting model, so ``DASH0_DISABLE``, ``DASH0_OTEL_COLLECTOR_BASE_URL``, the
  ``telemetry.distro.*`` and ``dash0.package.*`` attributes, the sampler and
  propagator defaults and the ``host``, ``process`` and ``service`` detectors
  apply to the default file exactly as they apply to a file named by
  ``OTEL_CONFIG_FILE``.
  ``OTEL_SDK_DISABLED=true`` keeps the default file from loading at all, read
  from the system property, the environment variable and the properties file
  ``otel.javaagent.configuration-file`` names, which is the same set of three
  the SDK resolves it from under environment configuration. ``DASH0_DISABLE``
  is now read from those three as well. A
  declaratively configured SDK reads no ``OTEL_SDK_DISABLED``, so a host-wide
  file that loaded anyway would restart a workload whose operator had silenced
  it. An explicit ``OTEL_CONFIG_FILE`` is unaffected, since that is an opt-in.
  A default file that cannot be read or parsed stops autoconfiguration, as does
  one that parses to no document at all, which an empty file, a file of
  whitespace, a file of comments and a bare ``---`` all do. The agent reports
  that it failed to start, and the JVM then runs uninstrumented and exports
  nothing. There is no fallback to environment configuration, which is what the
  Dash0 Python and Node.js distributions do with their own default file.
  Whatever ships the file is where it has to be validated.
  A host leaves the default file behind by removing or renaming it, which puts
  the next JVM back on environment configuration, or by setting
  ``OTEL_CONFIG_FILE`` for a single workload. No variable selects environment
  configuration while the file is there.
  Every other standard ``OTEL_*`` variable stops taking effect on a host that
  gains the file, which the file answers for by interpolating the variables you
  set. ``OTEL_EXPORTER_OTLP_ENDPOINT`` and ``OTEL_RESOURCE_ATTRIBUTES`` are
  named in a single ``WARNING`` when they are set and the default file is
  loaded, since nothing in this distribution can restore either, and the Dash0
  Kubernetes operator carries the ``k8s.*`` attributes through the second one.
  ``OTEL_SERVICE_NAME`` survives, through the ``service`` detector the
  customizer inserts, unless the file names ``service.name`` itself.
  A host that has the Dash0 Java package installed and sets neither variable
  changes behaviour without changing its configuration, because the shipped file
  now configures the SDK. Both delivery shapes are covered: the repackaged agent
  jar and the standalone extension jar.
