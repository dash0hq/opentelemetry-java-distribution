# Use this template to create a changelog entry for release notes. Create one
# with:
#   go run go.opentelemetry.io/build-tools/chloggen@v0.30.0 new --config .chloggen/config.yaml --filename <slug>

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'.
change_type:

# A single word describing the area of concern (e.g. custom, agent,
# agentextension, resource, packaging, deps, ci, release, docs).
component:

# A brief description of the change. Surround your text with quotes ("") if it
# needs to start with a backtick (`).
note:

# Not rendered into CHANGELOG.rst, and not read by anything else either. The
# field exists only because chloggen rejects an entry whose list is empty, in
# an unconditional check with no configuration option to relax it. Put any
# number here. When this repository starts using pull requests, restore the
# link in .chloggen/summary.tmpl and give each entry its own number.
issues: [1]

# (Optional) One or more lines of additional information to render under the
# primary note. These lines are padded with 2 spaces and inserted directly into
# the document. Use pipe (|) for multiline entries.
subtext:

# If your change doesn't affect end users or the exported elements of any package,
# you should instead start your pull request title with "chore" or use the "Skip
# Changelog" label.
# Optional: The change log or logs in which this entry should be included.
# e.g. '[user]'. Include 'user' if the change is relevant to end users.
# Default: '[user]'
change_logs: []
